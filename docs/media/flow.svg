<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" lang="en" role="img" aria-labelledby="t d">
  <title id="t">Tell it once. The Router keeps every project moving.</title>
  <desc id="d">You → Inbox → Router agent → Folder queues → Claude Code → Dashboard</desc>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#181825" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="no-referrer" />
  <title>BantoDesk Remote</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="bar">
    <button id="back" class="iconbtn" type="button" aria-label="戻る" hidden>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg>
    </button>
    <div id="title">
      <div id="title-main">BantoDesk</div>
      <div id="title-sub"></div>
    </div>
    <div id="conn" class="conn off" title="接続状態"><span class="dot"></span><span id="conn-text">接続中…</span></div>
  </header>
  <main id="view"></main>
  <div id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
